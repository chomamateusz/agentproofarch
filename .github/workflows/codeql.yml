name: codeql

# NON-REQUIRED by policy rather than by tooling: unlike scorecard.yml this does
# produce a per-PR status, but a static-analysis finding needs reachability and
# severity triage before it is a merge wall. Findings land in the Security tab
# and are read by docs/audits/ci-security.md; a red run blocks nothing.

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  codeql:
    if: github.repository == 'chomamateusz/agentproofarch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
