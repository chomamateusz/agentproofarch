name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    if: github.repository == 'chomamateusz/agentproofarch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: demo/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: demo/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      # Advisory only (architecture §Security baseline): high/critical findings
      # are triaged, but audit's transitive noise must not break the build.
      - run: pnpm audit --prod --audit-level=high
        continue-on-error: true

  smoke:
    if: github.repository == 'chomamateusz/agentproofarch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agentproofarch
          POSTGRES_PASSWORD: agentproofarch
          POSTGRES_DB: agentproofarch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentproofarch"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # Local SMTP sink for the US-026 magic-link phase: the real smtp adapter
      # delivers here; smoke/e2e read the message back over its HTTP API.
      mailpit:
        image: axllent/mailpit:v1.21
        ports:
          - 47925:1025
          - 47980:8025
        env:
          MP_SMTP_AUTH_ACCEPT_ANY: 'true'
          MP_SMTP_AUTH_ALLOW_INSECURE: 'true'
    env:
      DATABASE_URL: postgresql://agentproofarch:agentproofarch@localhost:5432/agentproofarch
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: demo/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: demo/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # Integration tests need a real Postgres, which only this smoke job has;
      # run them here (not in the check job, which is database-free, nor in the
      # local `smoke` script, which must stay fast) before the runtime smoke.
      - run: pnpm run test:integration
      - run: pnpm run smoke
      - run: pnpm run quickstart:probe

  e2e:
    if: github.repository == 'chomamateusz/agentproofarch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agentproofarch
          POSTGRES_PASSWORD: agentproofarch
          POSTGRES_DB: agentproofarch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentproofarch"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # Local SMTP sink for the US-026 magic-link phase: the real smtp adapter
      # delivers here; smoke/e2e read the message back over its HTTP API.
      mailpit:
        image: axllent/mailpit:v1.21
        ports:
          - 47925:1025
          - 47980:8025
        env:
          MP_SMTP_AUTH_ACCEPT_ANY: 'true'
          MP_SMTP_AUTH_ALLOW_INSECURE: 'true'
    env:
      DATABASE_URL: postgresql://agentproofarch:agentproofarch@localhost:5432/agentproofarch
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: demo/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: demo/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # A real browser over the real stack: the only surface smoke can't reach
      # (it drives the CLI, never a browser). Needs both a browser and Postgres,
      # so it stays out of `pnpm run check`; the e2e server boots entry.node.ts
      # against an isolated agentproofarch_e2e database and serves this bundle.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run build:web
      - run: pnpm run e2e

  # NON-REQUIRED (ADR-0008): `visual` is in no ruleset's required list, so
  # this job reports a pixel regression without blocking a merge until the owner
  # arms it. Baselines are rendered by this same linux image, never on a mac.
  visual:
    if: github.repository == 'chomamateusz/agentproofarch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agentproofarch
          POSTGRES_PASSWORD: agentproofarch
          POSTGRES_DB: agentproofarch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentproofarch"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mailpit:
        image: axllent/mailpit:v1.21
        ports:
          - 47925:1025
          - 47980:8025
        env:
          MP_SMTP_AUTH_ACCEPT_ANY: 'true'
          MP_SMTP_AUTH_ALLOW_INSECURE: 'true'
    env:
      DATABASE_URL: postgresql://agentproofarch:agentproofarch@localhost:5432/agentproofarch
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: demo/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: demo/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run build:web
      - run: pnpm run visual
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: visual-diff
          path: demo/test-results
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: demo/playwright-report
          retention-days: 7

  # ADR-0013: the gallery publisher. It is the only job holding write scopes, and
  # it runs after a green comparison too, so a sticky comment from an earlier red
  # run is corrected instead of left standing. A fork PR skips it: that token is
  # read-only whatever this block asks for.
  visual-report:
    needs: visual
    if: >-
      always()
      && github.event_name == 'pull_request'
      && github.repository == 'chomamateusz/agentproofarch'
      && github.event.pull_request.head.repo.full_name == github.repository
      && contains(fromJSON('["success", "failure"]'), needs.visual.result)
    runs-on: ubuntu-latest
    # Serialised, never cancelled: two PRs force-pushing the report branch at
    # once would lose each other's images.
    concurrency:
      group: visual-reports
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    defaults:
      run:
        working-directory: demo
    steps:
      # The trusted base commit, never the pull-request head: this job must not
      # execute PR-authored code while it holds a write token.
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: demo/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: demo/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # A comparison that died before writing any PNG produces no artifact at
      # all; the gallery still has to report that, so a missing one is not fatal.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: needs.visual.result == 'failure'
        continue-on-error: true
        with:
          name: visual-diff
          path: ${{ runner.temp }}/visual-diff
      # The trusted base can predate the publisher — on the pull request that
      # introduces it, and on any PR whose base commit is older than the wiring.
      # With no script at the base there is nothing trusted to run, so the job
      # skips instead of failing red on a missing pnpm script; it must never
      # fall back to the head's copy, which is the exposure this job exists to
      # avoid.
      - id: publisher
        run: |
          if [ -f scripts/visual-report.ts ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::visual-report publisher absent at the trusted base commit; skipping"
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.publisher.outputs.present == 'true'
        run: pnpm run visual:report
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
          VISUAL_OUTCOME: ${{ needs.visual.result }}
          VISUAL_ARTIFACT_DIR: ${{ runner.temp }}/visual-diff
