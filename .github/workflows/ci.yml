name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    if: github.repository == 'chomamateusz/agentproofarch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: demo/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: demo/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      # Advisory only (architecture §Security baseline): high/critical findings
      # are triaged, but audit's transitive noise must not break the build.
      - run: pnpm audit --prod --audit-level=high
        continue-on-error: true

  smoke:
    if: github.repository == 'chomamateusz/agentproofarch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo
    services:
      postgres:
        image: postgres:16@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
        env:
          POSTGRES_USER: agentproofarch
          POSTGRES_PASSWORD: agentproofarch
          POSTGRES_DB: agentproofarch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentproofarch"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # Local SMTP sink for the US-026 magic-link phase: the real smtp adapter
      # delivers here; smoke/e2e read the message back over its HTTP API.
      mailpit:
        image: axllent/mailpit:v1.21@sha256:81370195cd4a0eab9604d17c2617a7525b0486f9365555253b6c5376c6350f1a
        ports:
          - 47925:1025
          - 47980:8025
        env:
          MP_SMTP_AUTH_ACCEPT_ANY: 'true'
          MP_SMTP_AUTH_ALLOW_INSECURE: 'true'
    env:
      DATABASE_URL: postgresql://agentproofarch:agentproofarch@localhost:5432/agentproofarch
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: demo/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: demo/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # Integration tests need a real Postgres, which only this smoke job has;
      # run them here (not in the check job, which is database-free, nor in the
      # local `smoke` script, which must stay fast) before the runtime smoke.
      - run: pnpm run test:integration
      - run: pnpm run smoke
      - run: pnpm run quickstart:probe

  e2e:
    if: github.repository == 'chomamateusz/agentproofarch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo
    services:
      postgres:
        image: postgres:16@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
        env:
          POSTGRES_USER: agentproofarch
          POSTGRES_PASSWORD: agentproofarch
          POSTGRES_DB: agentproofarch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentproofarch"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # Local SMTP sink for the US-026 magic-link phase: the real smtp adapter
      # delivers here; smoke/e2e read the message back over its HTTP API.
      mailpit:
        image: axllent/mailpit:v1.21@sha256:81370195cd4a0eab9604d17c2617a7525b0486f9365555253b6c5376c6350f1a
        ports:
          - 47925:1025
          - 47980:8025
        env:
          MP_SMTP_AUTH_ACCEPT_ANY: 'true'
          MP_SMTP_AUTH_ALLOW_INSECURE: 'true'
    env:
      DATABASE_URL: postgresql://agentproofarch:agentproofarch@localhost:5432/agentproofarch
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: demo/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: demo/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # A real browser over the real stack: the only surface smoke can't reach
      # (it drives the CLI, never a browser). Needs both a browser and Postgres,
      # so it stays out of `pnpm run check`; the e2e server boots entry.node.ts
      # against an isolated agentproofarch_e2e database and serves this bundle.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run build:web
      - run: pnpm run e2e

  # NON-REQUIRED (ADR-0008): `visual` is in no ruleset's required list, so
  # this job reports a pixel regression without blocking a merge until the owner
  # arms it. Baselines are rendered by this same linux image, never on a mac.
  visual:
    if: github.repository == 'chomamateusz/agentproofarch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo
    services:
      postgres:
        image: postgres:16@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
        env:
          POSTGRES_USER: agentproofarch
          POSTGRES_PASSWORD: agentproofarch
          POSTGRES_DB: agentproofarch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentproofarch"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mailpit:
        image: axllent/mailpit:v1.21@sha256:81370195cd4a0eab9604d17c2617a7525b0486f9365555253b6c5376c6350f1a
        ports:
          - 47925:1025
          - 47980:8025
        env:
          MP_SMTP_AUTH_ACCEPT_ANY: 'true'
          MP_SMTP_AUTH_ALLOW_INSECURE: 'true'
    env:
      DATABASE_URL: postgresql://agentproofarch:agentproofarch@localhost:5432/agentproofarch
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: demo/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: demo/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run build:web
      - run: pnpm run visual
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: visual-diff
          path: demo/test-results
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: demo/playwright-report
          retention-days: 7

  # ADR-0013: the gallery publisher. It is the only job holding write scopes, and
  # it runs after a green comparison too, so a sticky comment from an earlier red
  # run is corrected instead of left standing. A fork PR skips it: that token is
  # read-only whatever this block asks for.
  visual-report:
    needs: visual
    if: >-
      always()
      && github.event_name == 'pull_request'
      && github.repository == 'chomamateusz/agentproofarch'
      && github.event.pull_request.head.repo.full_name == github.repository
      && contains(fromJSON('["success", "failure"]'), needs.visual.result)
    runs-on: ubuntu-latest
    # Serialised, never cancelled: two PRs force-pushing the report branch at
    # once would lose each other's images.
    concurrency:
      group: visual-reports
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    defaults:
      run:
        working-directory: demo
    steps:
      # The trusted base commit, never the pull-request head: this job must not
      # execute PR-authored code while it holds a write token.
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: demo/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: demo/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # A comparison that died before writing any PNG produces no artifact at
      # all; the gallery still has to report that, so a missing one is not fatal.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: needs.visual.result == 'failure'
        continue-on-error: true
        with:
          name: visual-diff
          path: ${{ runner.temp }}/visual-diff
      # The trusted base can predate the publisher — on the pull request that
      # introduces it, and on any PR whose base commit is older than the wiring.
      # With no script at the base there is nothing trusted to run, so the job
      # skips instead of failing red on a missing pnpm script; it must never
      # fall back to the head's copy, which is the exposure this job exists to
      # avoid.
      - id: publisher
        run: |
          if [ -f scripts/visual-report.ts ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::visual-report publisher absent at the trusted base commit; skipping"
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      # Advisory "AI read": one line per changed screenshot judging whether the
      # pixel change looks intentional given the PR's file diff. FAIL-OPEN by
      # construction, never a gate: every step in this chain is skippable or
      # continue-on-error, the publisher below runs regardless of their
      # outcomes, and a missing token, model error or timeout degrades to a
      # "verdict unavailable" note inside the gallery comment. The model reads
      # the PNGs from the runner's disk (Claude Code's Read tool is multimodal),
      # so nothing has to be published before it runs.
      - name: Detect verdict token
        id: verdict-token
        # Only a presence boolean is emitted — the slot secret's value is never
        # echoed; the ai-review slot-1 token is reused with the same
        # skip-if-absent semantics.
        env:
          SLOT1: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_1 }}
        run: |
          [ -n "$SLOT1" ] && echo "has_token=true" >> "$GITHUB_OUTPUT" || echo "has_token=false" >> "$GITHUB_OUTPUT"
      - name: Prepare AI verdict input
        id: verdict-input
        if: steps.publisher.outputs.present == 'true' && steps.verdict-token.outputs.has_token == 'true'
        continue-on-error: true
        run: |
          if [ -f scripts/visual-verdict-input.ts ]; then
            pnpm run visual:verdict-input
          else
            echo "::notice::verdict input builder absent at the trusted base commit; the gallery notes the verdict as unavailable"
            exit 1
          fi
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          VISUAL_ARTIFACT_DIR: ${{ runner.temp }}/visual-diff
          VERDICT_DIR: ${{ runner.temp }}/visual-verdict
      - name: AI verdict — advisory, fail-open
        id: verdict
        if: steps.verdict-input.outcome == 'success' && steps.verdict-input.outputs.screenshots != '0'
        continue-on-error: true
        # Bounds the known `--json-schema` CLI-hang failure mode
        # (claude-code#27926); here a timeout is a missing advisory line, never
        # a red job.
        timeout-minutes: 10
        uses: anthropics/claude-code-action@44423bdec74b97d67543eb16c110546762c110b2 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_1 }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            You write the advisory "AI read" lines for the visual review
            gallery. Read ${{ runner.temp }}/visual-verdict/context.md: it
            lists every changed screenshot with its differing-pixel count and
            the on-disk paths of the baseline, actual and diff PNGs — open the
            images with the Read tool — followed by the pull request's file
            diff (names + patches, truncated). For each screenshot judge
            whether the visual change looks INTENTIONAL given that diff.
            Write one short line per screenshot, in Polish, in one of these
            shapes:
              ok — jawnie zmienione w PR (LoginPage: mt 0.4→1.2rem)
              ok — propagacja zmiany z <komponent>
              uwaga — nic w diffie nie tłumaczy tej zmiany
            Keep each line under 120 characters; when unsure, say "uwaga" and
            name the doubt in a few words. You are advisory only — you cannot
            fail or gate anything. Do not modify any files. Conclude by calling
            the StructuredOutput tool with `verdicts`: one { screenshot, line }
            object per screenshot, where `screenshot` is the stem exactly as
            listed in context.md.
          claude_args: >-
            --model ${{ vars.VISUAL_VERDICT_MODEL || 'sonnet' }}
            --max-turns 16
            --add-dir ${{ runner.temp }}/visual-verdict
            --allowedTools "Read,Glob"
            --json-schema '{"type":"object","properties":{"verdicts":{"type":"array","items":{"type":"object","properties":{"screenshot":{"type":"string"},"line":{"type":"string"}},"required":["screenshot","line"]}}},"required":["verdicts"]}'
      - if: steps.publisher.outputs.present == 'true'
        run: pnpm run visual:report
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
          VISUAL_OUTCOME: ${{ needs.visual.result }}
          VISUAL_ARTIFACT_DIR: ${{ runner.temp }}/visual-diff
          # The before/after of baselines committed in the PR: two immutable
          # commits the publisher turns into raw.githubusercontent URLs. This
          # repository is public, so those images need no token to render.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          AI_VERDICTS: ${{ steps.verdict.outputs.structured_output }}
