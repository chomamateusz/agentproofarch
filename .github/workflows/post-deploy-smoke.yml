name: post-deploy-smoke

on:
  deployment_status:

# The shared canary tenant requires one writer per environment. Never cancel a
# running production verification; GitHub keeps only the newest pending run, so
# an intermediate smoke may be superseded, which is safe because the newer
# deployment replaces the older one.
concurrency:
  group: post-deploy-smoke-${{ github.event.deployment.environment }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  smoke-remote:
    if: >-
      github.repository == 'chomamateusz/agentproofarch' &&
      github.event.deployment_status.state == 'success' &&
      (github.event.deployment.environment == 'Production' ||
       github.event.deployment.environment == 'Preview')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ github.event.deployment.sha }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: demo/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: demo/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # Drive the production ALIAS, not environment_url (the per-deployment URL):
      # the alias is what users hit, Better Auth only trusts APP_BASE_URL as the
      # CSRF origin, and testing the alias also proves promotion/aliasing worked.
      # Production drives the alias (what users hit, proves promotion worked);
      # previews/staging drive their own deployment URL — auth trusts it via
      # the VERCEL_URL-derived origin.
      - run: pnpm run smoke:remote
        env:
          BASE_URL: ${{ github.event.deployment.environment == 'Production' && 'https://agentproofarch.vercel.app' || github.event.deployment_status.environment_url }}
          SMOKE_EMAIL: ${{ secrets.SMOKE_EMAIL || 'demo@agentproofarch.dev' }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD || 'demo1234' }}
          # Deploy attestation: the smoke asserts the live health SHA equals the
          # SHA this deployment event carried, so it can never green a stale deploy.
          EXPECTED_SHA: ${{ github.event.deployment.sha }}
