name: docs-deploy

# Publishes website/ to GitHub Pages after a merge to main. GitHub Pages must be
# set to "GitHub Actions" by the repository owner (Settings -> Pages) before the
# first run can succeed; until then this workflow fails at the deploy step and
# nothing else is affected.

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'CHANGELOG.md'
      - '.github/workflows/docs-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

# Never cancel in progress: a running Pages deployment must finish rather than be
# pre-empted by the next push.
concurrency:
  group: docs-pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.repository == 'chomamateusz/agentproofarch' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: website/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # No separate link-check step: onBrokenLinks/onBrokenAnchors are `throw`.
      - run: pnpm run build
      # Diagrams render client-side, so the build cannot catch a malformed one.
      - run: pnpm run check:mermaid
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/build

  deploy:
    if: >-
      github.repository == 'chomamateusz/agentproofarch' &&
      github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
