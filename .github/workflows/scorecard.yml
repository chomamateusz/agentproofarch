name: scorecard

# NON-REQUIRED, and unrequirable: ossf/scorecard-action supports push and
# schedule on the default branch only, and documents pull_request and
# workflow_dispatch as experimental — so it never produces a per-PR status a
# ruleset could require. Findings land in the Security tab and are triaged by
# hand against docs/audits/ci-security.md; a low score blocks nothing.

on:
  schedule:
    - cron: '37 4 * * 1'
  # Experimental upstream, kept for a manual re-run on main after a workflow
  # or ruleset change rather than waiting a week for the cron.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    if: github.repository == 'chomamateusz/agentproofarch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # Publishing to the public OpenSSF API (and the badge) also replaces
          # OpenSSF's own weekly scan with this run's results — an owner call,
          # and the only input here that would need `id-token: write`.
          publish_results: false
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 7
      - uses: github/codeql-action/upload-sarif@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3.39.1
        with:
          sarif_file: results.sarif
